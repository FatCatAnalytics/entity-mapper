[package]
name = "entity-mapper"
version = "1.0.0"
description = "Entity Mapper desktop shell: a window around the local matching engine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
